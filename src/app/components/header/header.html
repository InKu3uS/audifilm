<div class="bg-linear-to-r from-white via-orange-50 to-orange-200 shadow-md">
  <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <!-- Logo / Título -->
    <h3 class="text-xl sm:text-2xl md:text-3xl font-serif font-bold text-orange-800 tracking-wide">
      {{ 'header.title' | i18n }}
    </h3>

    <!-- Desktop menu (> sm) -->
    <div class="hidden sm:flex items-center gap-4">
      <button
        class="bg-white/80 text-orange-600 border border-orange-500 rounded-full px-4 py-2 shadow-md hover:bg-orange-500 hover:text-white hover:font-medium transition-all"
        routerLink="/new"
      >
        {{ 'header.new_recipe' | i18n }}
      </button>

      <div class="relative">
        <select
          class="appearance-none bg-white border border-orange-300 text-orange-800 font-medium py-2 px-4 pr-8 rounded-lg shadow-sm cursor-pointer hover:border-orange-400 transition-colors duration-200"
          (change)="changeLanguage($event)"
        >
          <option value="" disabled selected>{{ 'header.select_language' | i18n }}</option>
          <option value="es">🇪🇸 Spanish</option>
          <option value="en">🇬🇧 English</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
        <div
          class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-orange-600"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Hamburger boton (<sm) -->
    <div class="sm:hidden">
      <button (click)="isMenuOpen = !isMenuOpen" class="text-orange-800 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile dropdown menu (< sm) -->
  <div
    *ngIf="isMenuOpen"
    class="sm:hidden px-6 pb-4 flex flex-col gap-3 bg-linear-to-r from-white via-orange-50 to-orange-200 shadow-inner"
  >
    <button
      class="bg-white/80 text-orange-600 border border-orange-500 mx-auto w-max rounded-full px-4 py-2 mt-2 shadow-md hover:bg-orange-500 hover:text-white hover:font-medium transition-all"
      routerLink="/new"
      (click)="isMenuOpen = false"
    >
      {{ 'header.new_recipe' | i18n }}
    </button>

    <div class="relative mx-auto w-max">
      <select
        class="appearance-none bg-white border border-orange-300 text-orange-800 font-medium py-2 px-4 pr-8 rounded-lg shadow-sm cursor-pointer hover:border-orange-400 transition-colors duration-200 w-full"
        (change)="changeLanguage($event); isMenuOpen = false"
      >
        <option value="" disabled selected>{{ 'header.select_language' | i18n }}</option>
        <option value="es">🇪🇸 Spanish</option>
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
      <div
        class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-orange-600"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </div>
  </div>
</div>
