<div
  class="flex items-center justify-between bg-linear-to-r from-white via-orange-50 to-orange-200 py-5 px-6 shadow-md"
>
  <h3 class="text-3xl font-serif font-bold text-orange-800 tracking-wide">
    {{ 'header.title' | i18n }}
  </h3>

  <div class="flex items-center gap-4">
    <button
      class="bg-white/80 text-orange-600 border border-orange-500 rounded-full px-4 py-2 shadow-md hover:bg-orange-500 hover:text-white hover:font-medium transition-all"
      routerLink="/new"
    >
      {{ 'header.new_recipe' | i18n }}
    </button>

    <div class="relative">
      <select
        class="appearance-none bg-white border border-orange-300 text-orange-800 font-medium py-2 px-4 pr-8 rounded-lg shadow-sm cursor-pointer hover:border-orange-400 transition-colors duration-200"
        (change)="changeLanguage($event)"
      >
        <option value="" disabled selected>{{ 'header.select_language' | i18n }}</option>
        <option value="es">🇪🇸 Spanish</option>
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
      <!-- Icono de flecha -->
      <div
        class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-orange-600"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </div>
  </div>
</div>
