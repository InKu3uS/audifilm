<h1 class="flex justify-center text-4xl m-6 font-bold">Recipes list</h1>
<div class="grid sm:flex gap-4 p-4 justify-center">
  <!-- Name filter -->
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input matInput type="text" [(ngModel)]="filters.name" />
  </mat-form-field>

  <!-- Categories filter -->
  <mat-form-field class="w-full sm:w-48">
    <mat-label>Select an option</mat-label>
    <mat-select [(ngModel)]="filters.category">
      <mat-option value="">All categories</mat-option>
      <mat-option value="starter">Starters</mat-option>
      <mat-option value="main">Main dishes</mat-option>
      <mat-option value="dessert">Desserts</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Difficulties filter -->
  <mat-form-field>
    <mat-label>All difficulties</mat-label>
    <mat-select [(ngModel)]="filters.difficulty">
      <mat-option value="">All difficulties</mat-option>
      <mat-option value="easy">Easy</mat-option>
      <mat-option value="medium">Medium</mat-option>
      <mat-option value="hard">Hard</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Duration Filter -->
  <mat-form-field>
    <mat-label>Duration</mat-label>
    <input matInput type="number" [(ngModel)]="filters.duration" />
  </mat-form-field>
</div>

<div class="flex flex-wrap justify-center gap-4 p-2">
  @for (recipe of filteredRecipes; track $index) {
  <div
    class="flex justify-center flex-col text-center bg-gray-200 rounded-md shadow-md py-10 px-10 md:px-15 lg:px-20"
  >
    <h2 class="text-xl font-semibold mb-2 truncate">{{ recipe.name }}</h2>
    <p>{{ recipe.category }}</p>
    <img class="w-40 h-40" src="{{ recipe.imageUrl }}" alt="{{ recipe.name }}" />
    <button
      class="bg-green-800 hover:bg-green-900 text-white px-4 py-2 mt-3 mx-auto rounded-full inline-block"
      routerLink="/recipe/{{ recipe.id }}"
    >
      View recipe
    </button>
  </div>
  }
</div>
